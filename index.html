<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>0_0</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #0a0a0a; --card: #161616; --line: #232323; --text: #f3f3f3; --muted: #8d8d8d; --dim: #3d3d3d; --green: #3ecf8e; --amber: #e8a857; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 440px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); }
  .mark { font-size: 30px; font-weight: 700; letter-spacing: 1px; min-height: 40px; }
  .mark.dim { color: var(--dim); letter-spacing: -1px; }
  .apps { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
  .app { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 22px; background: var(--card); color: inherit; text-decoration: none; }
  .app:active { transform: scale(.985); }
  .ic { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: #222; font-size: 19px; font-weight: 700; }
  .app div { flex: 1; min-width: 0; }
  .app b { display: block; font-size: 19px; }
  .app small { display: block; margin-top: 3px; font-size: 15px; color: var(--muted); }
  .go { color: #555; font-size: 26px; }
  .green { color: var(--green) !important; } .amber { color: var(--amber) !important; }
  .stack { margin-top: 60px; font-size: 52px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; color: var(--green); }
  .quiet .app { opacity: .45; }
  .backup { margin-top: auto; padding-top: 30px; text-align: center; font-size: 14px; color: var(--muted); }
  .backup button { font: inherit; color: var(--text); background: none; border: none; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>
<main>
  <div class="mark" id="face">0_0</div>
  <div class="stack" id="stack" hidden></div>
  <div class="apps" id="apps">
    <a class="app" href="money/"><span class="ic">$</span><div><b>Money</b><small id="moneyLine">&nbsp;</small></div><span class="go">›</span></a>
    <a class="app" href="study/"><span class="ic">✎</span><div><b>Study</b><small id="studyLine">&nbsp;</small></div><span class="go">›</span></a>
    <a class="app" href="plusone/"><span class="ic">+1</span><div><b>+1</b><small id="plusLine">&nbsp;</small></div><span class="go">›</span></a>
  </div>
  <p class="backup">Your apps keep everything on this phone. Updates don't touch it.<br>
    <button id="save">Back up everything</button> · <button id="load">Restore</button></p>
</main>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="money/money.js"></script>
<script>
  // The start screen: one line per app, so most days you don't need to open either.
  // Money's line is worked out fresh. +1 leaves its own line each time you open it.
  function render() {
    const m = document.getElementById('moneyLine'), p = document.getElementById('plusLine'), st = document.getElementById('studyLine'), face = document.getElementById('face');
    const s = load();
    face.textContent = '0_0'; face.className = 'mark';
    if (!s || !validState(s)) m.textContent = 'Set up';
    else {
      const st = getStatus(s);
      if (st.anyDue || !st.act) { m.textContent = 'Time to log'; m.className = ''; }
      else if (st.chillin) { m.textContent = 'You’re chillin'; m.className = 'green'; face.textContent = '-_-'; face.className = 'mark dim'; }
      else {
        const w = thisWeek(st);
        m.className = '';
        m.innerHTML = w.hours + ' hrs this week · ' + (w.ahead > 0 ? '<span class="green">' + w.ahead + ' ahead</span>'
          : w.ahead < 0 ? '<span class="amber">' + -w.ahead + ' behind</span>' : 'on track');
      }
    }
    // Study and +1 each leave a line behind when you open them.
    const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    const now = new Date(), day = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5;
    const monday = new Date((day - ((new Date(day * 864e5).getUTCDay() + 6) % 7)) * 864e5).toISOString().slice(0, 10);
    const sl = read('0_0-line-study'), sThisWeek = !!(sl && sl.week === monday);   // Study runs Mon–Sun
    st.textContent = sThisWeek ? sl.text : sl ? 'New week' : 'Set a weekly target';
    st.className = sThisWeek && sl.done ? 'green' : '';
    let line = read('plus-one-line');
    const pd = new Date(Date.now() - 4 * 36e5), plusToday = Date.UTC(pd.getFullYear(), pd.getMonth(), pd.getDate()) / 864e5;   // +1's day ends at 4 AM
    const fresh = line && line.day === plusToday;
    p.textContent = fresh ? line.text : 'Not opened today';

    // Chillin stacks, but only when every app is quiet at once.
    const quiet = [m.textContent === 'You’re chillin', !!(sThisWeek && sl.done), !!(fresh && line.done)];
    const all = quiet.every(Boolean), n = quiet.length;
    const LEVELS = ['', 'You’re chillin', 'You’re hecka chillin', 'You’re mega chillin bruh'];
    document.getElementById('stack').hidden = !all;
    document.getElementById('stack').innerHTML = all ? (LEVELS[n] || LEVELS[3]).replace(' ch', '<br>ch') : '';
    document.getElementById('apps').className = 'apps' + (all ? ' quiet' : '');
    if (all) { face.textContent = '-_-'; face.className = 'mark dim'; }
  }
  // One file with everything both apps have saved, so an update or a wiped browser can't lose it.
  const KEYS = ['0_0-money-v1', '0_0-study-v1', 'plus-one-v1'];
  document.getElementById('save').onclick = () => {
    const data = { app: '0_0', kind: 'everything', exported: new Date().toISOString().slice(0, 10), keys: {} };
    for (const k of KEYS) { const v = localStorage.getItem(k); if (v) data.keys[k] = v; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    a.download = '0_0-backup-' + data.exported + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById('load').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(t => {
      let d; try { d = JSON.parse(t); } catch {}
      const keys = d && (d.keys || (d.state ? { '0_0-money-v1': JSON.stringify(d.state) } : null));
      if (!keys) return alert('That file isn’t a 0_0 backup.');
      if (!confirm('Replace what’s on this phone with the backup from ' + (d.exported || 'that file') + '?')) return;
      for (const [k, v] of Object.entries(keys)) localStorage.setItem(k, v);
      render();
      alert('Restored.');
    }).finally(() => { e.target.value = ''; });
  };

  render();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  window.addEventListener('pageshow', render);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
