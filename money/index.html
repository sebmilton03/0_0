<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>0_0</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
  :root {
    --bg: #0a0a0a; --card: #1a1a1a; --line: #232323; --text: #f3f3f3; --muted: #8d8d8d; --dim: #3d3d3d;
    --green: #3ecf8e; --green-faint: rgba(62, 207, 142, .34); --amber: #e8a857; --red: #e5645e; --track: #262626;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  p { margin: 0; }
  h1, h2 { margin: 0; }

  .screen {
    max-width: 440px; min-height: 100%; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
  }
  .screen.reveal { animation: reveal .5s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .spacer { flex: 1; min-height: 24px; }
  .c { text-align: center; }
  .green { color: var(--green); } .amber { color: var(--amber); } .red { color: var(--red); }

  /* Top bar: the face and the gear */
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  .mark { font-size: 30px; font-weight: 700; letter-spacing: 1px; color: inherit; text-decoration: none; }
  .top.dim { color: var(--dim); }
  .top.dim .mark { letter-spacing: -1px; }
  .icon { display: grid; place-items: center; width: 44px; height: 44px; margin: -10px -10px -10px 0; color: inherit; }
  .head { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .head .icon { margin: -10px 0 -10px -10px; color: #ddd; }
  .head h2 { font-size: 23px; font-weight: 700; }

  /* Home */
  .label { font-size: 12px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .hero { margin-top: 48px; text-align: center; }
  .big { display: flex; justify-content: center; align-items: baseline; gap: 6px; margin-top: 10px; }
  .big b { font-size: 104px; font-weight: 700; letter-spacing: -4px; line-height: 1; }
  .big span { font-size: 36px; font-weight: 600; color: #9a9a9a; }
  .big.word b { font-size: 64px; letter-spacing: -2px; }
  .sub { margin-top: 12px; font-size: 18px; color: var(--muted); text-align: center; }
  .sub b { color: var(--text); font-weight: 600; }
  .bar { position: relative; height: 12px; margin-top: 36px; border-radius: 6px; background: var(--track); }
  .bar i { position: absolute; top: 0; bottom: 0; }
  .bar .paid { left: 0; border-radius: 6px 0 0 6px; background: var(--green); }
  .bar .logged { background: var(--green-faint); }
  .bar .gap { width: 3px; margin-left: -1.5px; background: var(--bg); }
  .bar .now { top: -4px; bottom: -4px; border: 1.5px solid rgba(255, 255, 255, .6); border-radius: 8px; }
  .barl { display: flex; justify-content: space-between; margin-top: 12px; font-size: 15px; color: var(--muted); }
  .weeks { display: flex; gap: 6px; margin-top: 30px; }
  .wk { flex: 1; min-width: 0; padding: 9px 4px 10px; border-radius: 14px; background: var(--card); text-align: center; border: 1.5px solid transparent; }
  .wk span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .wk b { display: block; margin-top: 3px; font-size: 22px; font-weight: 700; }
  .wk.next b { color: #5a5a5a; }
  .wk.now { border-color: rgba(255, 255, 255, .7); }
  .wk.ok b { color: var(--green); }
  .wk.planned { border-style: dashed; border-color: #555; }
  .wk.now.planned { border-color: rgba(255, 255, 255, .7); }
  button.wk { font: inherit; color: inherit; }
  .wk.short b { color: var(--amber); }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 3px; }
  .notes { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.45; color: var(--muted); text-align: center; }
  hr { width: 100%; margin: 26px 0 22px; border: 0; border-top: 1px solid var(--line); }
  .pocket { margin-top: 8px; font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1; text-align: center; }
  .asof { margin-top: 18px; font-size: 13px; color: #5c5c5c; text-align: center; }
  .btn { width: 100%; height: 60px; border-radius: 30px; background: #fff; color: #0a0a0a; font-size: 19px; font-weight: 600; }
  .btn:active, .ghost:active { transform: scale(.98); }
  .ghost { width: 100%; height: 56px; border-radius: 28px; border: 1.5px solid #3a3a3a; font-size: 17px; font-weight: 600; }
  .say { text-align: center; }
  .say h1 { font-size: 46px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.08; }
  .say p { margin-top: 22px; font-size: 17.5px; line-height: 1.55; color: var(--muted); }
  .chill h1 { font-size: 60px; letter-spacing: -2px; line-height: 1.02; color: var(--green); }
  .chill p { margin-top: 28px; font-size: 18.5px; line-height: 1.6; }
  .foot { display: block; width: 100%; padding: 8px; font-size: 14px; line-height: 1.6; color: #5a5a5a; text-align: center; }
  .card { background: var(--card); border-radius: 20px; padding: 16px 20px; }

  /* Log, settings, setup */
  .sec { margin-top: 28px; }
  .sec > .label { display: block; margin-bottom: 10px; }
  .field { display: flex; align-items: baseline; gap: 4px; background: var(--card); border-radius: 20px; padding: 14px 20px; border: 1.5px solid transparent; }
  .field:focus-within { border-color: #333; }
  .field input { flex: 1; width: 100%; min-width: 0; background: none; border: none; outline: none; font-size: 40px; font-weight: 700; letter-spacing: -1px; caret-color: var(--green); padding: 0; }
  .field input::placeholder { color: #3a3a3a; }
  .field .pre { font-size: 34px; font-weight: 700; color: #5a5a5a; }
  .field .r { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .field.unknown input { color: var(--muted); }
  .pair { display: flex; gap: 10px; }
  .pair .field { min-width: 0; padding: 14px 16px; }
  .field.stack { flex-direction: column; align-items: stretch; gap: 2px; }
  .field.stack small { font-size: 12px; color: var(--muted); }
  .field.stack .in { display: flex; align-items: baseline; gap: 4px; }
  .pair .field input { font-size: 30px; }
  .pair .field .pre { font-size: 26px; }
  .pair .field:first-child { flex: 1.7; }
  .pair .field:last-child { flex: 1; }
  .hint { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .link { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: left; }
  .link.inline { margin: 0 0 0 6px; color: var(--text); text-decoration: underline; font-size: inherit; }
  .sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; background: rgba(0, 0, 0, .6); }
  .panel { width: 100%; max-width: 440px; margin: 0 auto; padding: 22px 22px calc(22px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: #151515; border-top: 1px solid var(--line); }
  .panel .field { background: #0f0f0f; }
  .err { margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--red); }
  .warn { margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--amber); }
  .done-all { margin-top: 28px; font-size: 16px; color: var(--muted); }
  .total { font-size: 50px; font-weight: 700; letter-spacing: -1.5px; margin-top: 6px; }
  .line { display: flex; gap: 8px; margin-top: 8px; }
  .line input { min-width: 0; height: 48px; background: var(--card); border: 1.5px solid transparent; border-radius: 14px; padding: 0 14px; font-size: 16px; outline: none; }
  .line input:focus { border-color: #333; }
  .line .name { flex: 1; }
  .line .amt { width: 110px; text-align: right; }
  .line .x { width: 40px; color: var(--muted); font-size: 18px; }
  .line .fixed { flex: 1; display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 16px; }
  .add { width: 100%; height: 46px; margin-top: 8px; border: 1px dashed #3a3a3a; border-radius: 14px; color: var(--muted); font-size: 15px; }
  .info { margin-top: 14px; background: var(--card); border-radius: 20px; padding: 16px 20px; }
  .info .v { margin-top: 6px; font-size: 26px; font-weight: 700; }
  .info .v small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .date { display: block; background: var(--card); border-radius: 16px; padding: 10px 14px; }
  .date span { display: block; font-size: 12px; color: var(--muted); }
  .date input { width: 100%; margin-top: 4px; background: none; border: none; outline: none; font-size: 17px; color-scheme: dark; padding: 0; }
  .date.wide { grid-column: 1 / -1; }
  .steps { display: flex; gap: 6px; }
  .steps i { width: 22px; height: 4px; border-radius: 2px; background: #2a2a2a; }
  .steps i.on { background: var(--green); }
  .intro { font-size: 17px; line-height: 1.55; color: var(--muted); margin-top: 14px; }
  .intro b { color: var(--text); font-weight: 600; }
  .acts { display: flex; gap: 10px; }
  .acts .ghost { flex: 1; }
  .acts .btn { flex: 1.6; }
</style>
</head>
<body>
<main id="app">
  <section class="screen" id="home"></section>
  <section class="screen" id="log" hidden></section>
  <section class="screen" id="settings" hidden></section>
  <section class="screen" id="setup" hidden></section>
</main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="money.js"></script>
</body>
</html>
